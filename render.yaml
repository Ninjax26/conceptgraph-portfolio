services:
  - type: web
    name: conceptgraph-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    healthCheckPath: /api/v1/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USERNAME
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: conceptgraph_portfolio_chunks
      - key: EMBEDDING_PROVIDER
        value: qdrant_cloud
      - key: EMBEDDING_MODEL_NAME
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: EMBEDDING_DIMENSION
        value: "384"
      - key: RERANK_PROVIDER
        value: cohere
      - key: RERANK_MODEL_NAME
        value: rerank-v3.5
      - key: COHERE_API_KEY
        sync: false
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "30"
      - key: OBJECT_STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: S3_AUTO_CREATE_BUCKET
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DEMO_ACCESS_TOKEN
        sync: false
      - key: AUTH_COOKIE_SECURE
        value: "true"
      - key: AUTH_COOKIE_SAMESITE
        value: none
      - key: AUTH_SESSION_TTL_SECONDS
        value: "43200"
      - key: RATE_LIMIT_REQUESTS_PER_MINUTE
        value: "300"
      - key: RATE_LIMIT_EXPENSIVE_PER_MINUTE
        value: "30"
      - key: RATE_LIMIT_LOGIN_PER_MINUTE
        value: "10"
      - key: PROCESSING_CONCURRENCY
        value: "1"
      - key: PROCESSING_QUEUE_CAPACITY
        value: "8"
      - key: PROCESSING_LEASE_SECONDS
        value: "180"
      - key: PROCESSING_HEARTBEAT_SECONDS
        value: "30"
      - key: MAX_PDF_SIZE_MB
        value: "10"
      - key: MAX_PDFS_PER_INSTALLATION
        value: "50"
      - key: REQUIRE_UPLOAD_AUTH
        value: "true"
      - key: STRICT_STARTUP_VALIDATION
        value: "true"

  - type: web
    name: conceptgraph-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
